<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Storyboard A · Mesón · Sabores del Norte (demo)</title>
    <link rel="stylesheet" href="./estilo.css" />
  </head>
  <body>
    <div class="escena" data-escena></div>
    <div class="etiquetas" data-etiquetas aria-hidden="true"></div>

    <p class="aviso capa" role="note">
      Sitio de demostración: el nombre, los precios y el contacto son ficticios.
    </p>

    <main class="capa">
      <!-- La portada es una comanda apoyada en el mesón, entre los ingredientes -->
      <section class="portada" aria-labelledby="titular">
        <article class="ticket ticket--portada">
          <p class="ticket__negocio" translate="no">Sabores del Norte <span>demo</span></p>
          <h1 id="titular">Arroz con pato, cabrito y ceviche</h1>
          <p class="ticket__estado">
            <span data-estado></span>
            <a href="#horario">Horario</a>
          </p>
          <a class="ticket__corte" href="#carta">Armar mi pedido</a>
        </article>
      </section>

      <!-- Mitad del scroll: los ingredientes se ordenan; la pizarra trae el menú y el horario de hoy -->
      <section class="recorrido" aria-labelledby="titulo-menu">
        <div class="pizarra">
          <h2 id="titulo-menu">Menú del día</h2>
          <div data-menu></div>
        </div>
      </section>

      <section class="carta" id="carta" aria-labelledby="titulo-carta">
        <div class="ticket ticket--carta">
          <h2 id="titulo-carta">La carta</h2>
          <ul class="carta__lista" data-carta></ul>
        </div>
        <aside
          class="ticket ticket--comanda comanda-ticket"
          data-comanda
          hidden
          aria-labelledby="titulo-comanda"
        >
          <h2 id="titulo-comanda">Tu comanda</h2>
          <ol data-lineas></ol>
          <p class="comanda__total" data-total></p>
          <a class="ticket__corte" href="#carta">Enviar por WhatsApp</a>
        </aside>
      </section>

      <section class="horario" id="horario" aria-labelledby="titulo-horario">
        <div class="pizarra pizarra--ancha">
          <h2 id="titulo-horario">Horario</h2>
          <ul class="horario__dias" data-horario></ul>
        </div>
      </section>
    </main>

    <script type="module" src="./direccion.js"></script>
  </body>
</html>
